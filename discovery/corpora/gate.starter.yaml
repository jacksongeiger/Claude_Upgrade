  # --- near misses: mention tooling words but are NOT acquisition --------
  - label: silent
    text: "the playwright test is flaky, it times out about one run in five"
    note: Names a tool we index, but the task is debugging an existing setup.
  - label: silent
    text: "update the github action so it runs on pull requests too"
    note: Mentions github; this is editing CI config, not finding a tool.
  - label: silent
    text: "our postgres queries got slower after the last deploy, investigate"
    note: Names postgres; this is performance debugging.
  - label: silent
    text: "why is the docker image 2gb, what's taking up all the space"
  - label: silent
    text: "the slack webhook stopped firing after we rotated the token"
    note: Names slack; this is fixing a broken integration we already have.
  - label: silent
    text: "add pandas to the requirements file and pin it to the current version"
    note: Contains "add ... requirements" but the choice is already made.
  - label: silent
    text: "the linear ticket says the bug is in checkout, can you reproduce it"
  - label: silent
    text: "install the dependencies and run the test suite"
    note: Contains "install" but refers to existing project dependencies.

  # --- conversational / meta --------------------------------------------
  - label: silent
    text: "yes that looks right, go ahead and apply it"
  - label: silent
    text: "actually hold on, revert that last change"
  - label: silent
    text: "can you explain that again but shorter"
  - label: silent
    text: "what were we working on before the compact"
  - label: silent
    text: "okay that works, what should we do next on this project"
  - label: silent
    text: "nice, now do the same thing for the other two files"

  # ======================================================================
  # TASK-SHAPED — the hard class, added in v2.6
  # ======================================================================
  #
  # Nobody here asks for a tool. Every one of these describes a job Claude can
  # attempt unaided, which is exactly why it never goes looking, and exactly
  # what the whole project is for. These drove the `min_score_task`
  # calibration and the TASK_EXPANSIONS table in retrieve.py.
  - label: inject
    text: "take a screenshot of our landing page at desktop tablet and mobile widths and tell me what looks broken"
  - label: inject
    text: "i need to know which of our pinned dependencies have known CVEs"
  - label: inject
