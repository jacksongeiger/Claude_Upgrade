  # ======================================================================
  # TASK-SHAPED NOISE — same verbs, ordinary in-codebase work
  # ======================================================================
  #
  # This block is the reason the task path is safe to ship. Every verb the
  # task cases above rely on (convert, extract, generate, deploy, profile,
  # monitor, scrape, translate, screenshot) appears here on work that needs no
  # tool at all. A threshold that fires on these gets rdx uninstalled in a
  # week, so precision is measured against this block, not against the easy
  # "fix the failing test" negatives.
  - label: silent
    text: "convert this callback function to async await"
  - label: silent
