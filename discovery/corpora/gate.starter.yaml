# Starter gate corpus — provisional calibration.
#
# These are NOT the user's prompts. They are representative development
# prompts, hand-labelled, used to derive sensible default thresholds so a fresh
# install ships with working numbers instead of +inf.
#
# `rdx mine` produces the real corpus from actual transcript history and should
# replace these numbers. This file exists so the system is useful on day one
# rather than after a labelling session.
#
# The silent cases outnumber the inject cases roughly 3:1 on purpose: that is
# the real ratio of ordinary coding work to tool-acquisition questions, and
# calibrating on a balanced corpus would set the threshold far too low.
#
#   label: inject  -> a suggestion here would have been welcome
#          silent  -> a suggestion here would have been noise

