# Behavioural corpus — does the model ACT on the envelope?
#
# Every other corpus tests plumbing. This one tests the only thing that
# ultimately matters: a real model, with no knowledge of rdx, receives a real
# envelope through the real hook — does it surface the resource, ignore it, or
# actively distrust it?
#
# THE FIRST VERSION OF THIS FILE WAS A SOFTBALL. Every case asked for a tool
# outright ("is there an mcp server for ...") and scored 7/7 with a surfaced
# rate of 1.0, which proved only that the system works when you already know to
# ask. That is not the problem rdx exists to solve. The stated problem was "I
# don't know about most of them."
#
# So the cases below are TASK-SHAPED: the user describes work, never a tool.
# Claude can attempt every single one unaided — which is exactly why it never
# goes looking, and exactly why this is the hard case. A pass here means the
# model was making progress on its own and still had the awareness to surface
# something that would do the job better.
#
# The `noise` cases matter just as much. Task verbs (convert, extract,
# generate, export, deploy) appear constantly in ordinary coding work. If the
# gate fires on those, rdx gets uninstalled within a week.
#
# Fields:
#   prompt          sent verbatim to a headless `claude -p`
#   expect_fire     whether the gate should inject
#   expect_mentions OPTIONAL extra strings that also count as "surfaced". The
#                   slugs actually injected are added automatically by the
#                   harness, read back out of the injection log -- do NOT list
#                   the slug you expect to rank first. An earlier version of
#                   this file did, guessed `markitdown`, and scored a perfectly
#                   good surface of `mineru-document-extraction` as a miss.
#   kind            asked | task | noise  (documentation only)

cases:
  # === TASK-SHAPED: the real case ========================================
  # The user describes a job. A tool would do it better. Nobody asked.

  - id: task_document_conversion
    kind: task
    prompt: "convert this folder of word documents into markdown for our docs site"
    expect_fire: true
    expect_mentions: ["rdx install"]
    note: >
      Claude will happily write a python-docx loop. A document-extraction tool
      does it in one command and handles the edge cases. The whole thesis in
      one case.

  - id: task_dependency_audit
    kind: task
    prompt: "i need to know which of our pinned dependencies have known CVEs"
    expect_fire: true
    expect_mentions: ["rdx install"]
    note: >
      Said "400 dependencies" until the fixture only had 120, and the model
      spent its whole answer on the discrepancy instead of the task. Prompts
      here must not assert facts the working directory contradicts.

  - id: task_screenshot_breakpoints
    kind: task
    prompt: "take a screenshot of our landing page at desktop tablet and mobile widths and tell me what looks broken"
    expect_fire: true
    expect_mentions: ["rdx install"]
    note: >
      The case that proved the retrieval gap. `playwright` and
      `chrome-devtools-mcp` were both indexed and both eligible, and neither
      entered the candidate set: the user says "screenshot", the resource says
      "browser automation". Fixed by TASK_EXPANSIONS, not by a threshold.

      Wording matters and this prompt is the calibrated one. It first read
      "check how our landing page looks at ... widths", which dies at
      `no_intent` -- "check" is not an acquisition or task verb, and adding it
      would be reckless ("check the logs", "check if this works"). That is a
      real recall gap, recorded here rather than papered over by widening
      TASK_RE. A corpus prompt must be one the gate was actually calibrated
      against, or it measures a typo.

  # === IN-CODEBASE NOISE: the same verbs, pointed at our own code ========
  # These are the deixis cases. Every one was a measured false fire before
  # CODEBASE_RE, and each names something in the repo rather than an external
  # artifact.

  - id: noise_call_sites
    kind: noise
    prompt: "find every call site of this function and tell me which are dead"
    expect_fire: false

  - id: noise_headless_screenshot
    kind: noise
    prompt: "screenshot is blank when i run the test headlessly, any idea why"
    expect_fire: false
    note: >
      Same noun as task_screenshot_breakpoints, opposite situation. If the
      gate cannot tell these apart it is not usable.

  # === ASKED-FOR: the easy case, kept as a control =======================

  - id: asked_linear
    kind: asked
    prompt: "is there an mcp server for managing linear issues and projects"
    expect_fire: true
    expect_mentions: ["rdx install"]
    note: Control. If this ever fails, the framing has regressed.

  # === NOISE: task-shaped but ordinary in-codebase work ==================
  # These use the same verbs as the task cases. Firing here is the failure
  # mode that gets the whole system turned off.

  - id: noise_convert_callback
    kind: noise
    prompt: "convert this callback function to async await"
    expect_fire: false

  - id: noise_extract_helper
    kind: noise
    prompt: "extract this validation logic into its own helper function"
    expect_fire: false

  - id: noise_deploy
    kind: noise
    prompt: "deploy the current branch to staging"
    expect_fire: false

  - id: noise_ordinary_debug
    kind: noise
    prompt: "the auth test fails intermittently, roughly one run in five. why"
    expect_fire: false
