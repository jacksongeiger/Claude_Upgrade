# Behavioural corpus — does the model ACT on the envelope?
#
# Every other corpus tests plumbing. This one tests the only thing that
# ultimately matters: a real model, with no knowledge of rdx, receives a real
# envelope through the real hook — does it surface the resource, ignore it, or
# actively distrust it?
#
# THE FIRST VERSION OF THIS FILE WAS A SOFTBALL. Every case asked for a tool
# outright ("is there an mcp server for ...") and scored 7/7 with a surfaced
# rate of 1.0, which proved only that the system works when you already know to
# ask. That is not the problem rdx exists to solve. The stated problem was "I
# don't know about most of them."
#
# So the cases below are TASK-SHAPED: the user describes work, never a tool.
# Claude can attempt every single one unaided — which is exactly why it never
# goes looking, and exactly why this is the hard case. A pass here means the
# model was making progress on its own and still had the awareness to surface
# something that would do the job better.
#
# The `noise` cases matter just as much. Task verbs (convert, extract,
# generate, export, deploy) appear constantly in ordinary coding work. If the
# gate fires on those, rdx gets uninstalled within a week.
#
# Fields:
#   prompt          sent verbatim to a headless `claude -p`
#   expect_fire     whether the gate should inject
#   expect_mentions any of these in the output counts as "surfaced"
#   kind            asked | task | noise  (documentation only)

cases:
  # === TASK-SHAPED: the real case ========================================
  # The user describes a job. A tool would do it better. Nobody asked.

  - id: task_document_conversion
    kind: task
    prompt: "convert this folder of word documents into markdown for our docs site"
    expect_fire: true
    expect_mentions: ["rdx install", "rdx index", "markitdown", "docling"]
    note: >
      Claude will happily write a python-docx loop. markitdown does it in one
      command and handles the edge cases. This is the whole thesis in one case.

  - id: task_dependency_audit
    kind: task
    prompt: "i need to know which of our 400 dependencies have known CVEs"
    expect_fire: true
    expect_mentions: ["rdx install", "rdx index"]

  # === ASKED-FOR: the easy case, kept as a control =======================

  - id: asked_linear
    kind: asked
    prompt: "is there an mcp server for managing linear issues and projects"
    expect_fire: true
    expect_mentions: ["rdx install", "rdx index"]
    note: Control. If this ever fails, the framing has regressed.

  # === NOISE: task-shaped but ordinary in-codebase work ==================
  # These use the same verbs as the task cases. Firing here is the failure
  # mode that gets the whole system turned off.

  - id: noise_convert_callback
    kind: noise
    prompt: "convert this callback function to async await"
    expect_fire: false

  - id: noise_extract_helper
    kind: noise
    prompt: "extract this validation logic into its own helper function"
    expect_fire: false

  - id: noise_deploy
    kind: noise
    prompt: "deploy the current branch to staging"
    expect_fire: false

  - id: noise_ordinary_debug
    kind: noise
    prompt: "the auth test fails intermittently, roughly one run in five. why"
    expect_fire: false
