# Validation stage settings. The human edits the numbers; the referee reads them.

[budget]
# stage total across every role and PIVOT pass, in USD. Measured on real
# runs (2026-09-18): small band author $0.87, setter $0.69, fetcher $0.33;
# mid band (six claims, 21 measures) author $0.38, setter $1.01, skeptic
# $1.02, fetcher $1.37, judge $0.35. A PIVOT pass re-runs the author and
# setter and re-fetches only what changed.
usd = 15.0
# the under-$20 path (author -> setter -> fetcher -> referee)
usd_small = 7.0

[bands]
# build budget bands, by the --build-usd named at invocation
small_max_usd = 20
mid_max_usd = 100

# Required evidence per band. tier: 1 = anecdotal (three independent rows
# make one point), 2 = primary data (one re-runnable row clearing its kill
# number), 3 = observed use. The core claim is never satisfied by tier 1.
[require.small]
core = 2
other = 0

[require.mid]
core = 2
other = 1

[require.large]
core = 2
other = 2
# a tier-3 row from an experiment before any milestone with dependencies
tier3_before_dependent_milestone = true

[tiers]
anecdotal_rows_per_point = 3

[roles]
author = "fable"
setter = "fable"
skeptic = "fable"
fetcher = "sonnet"
judge = "sonnet"

[caps]
# per-child ceilings; the stage total above still binds. A child that hits
# its ceiling exits 1 with its file already written; the schema check decides.
# The mid-band setter and skeptic both crossed $1.00 on six claims.
author = 1.5
setter = 2.0
skeptic = 2.0
fetcher = 3.0
judge = 1.5
